name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Keep in sync with sensors.yml (whose guard asserts the repo matches them).
env:
  PNPM_VERSION: "10.21.0"
  NODE_VERSION: "26"

concurrency:
  group: verify-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned here, not read from the PR's packageManager field (the guard asserts they match).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # No lifecycle scripts or pnpmfile: nothing from the PR runs before the checks.
      - run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile
      # Whatever the lockfile says, the checkers must be the registry packages of the same name
      # (catches aliasing, link: and tarball swaps however the YAML is spelled), and the pins hold.
      - name: Checkers resolve to their registry packages
        run: |
          test "$(cat .node-version)" = "$NODE_VERSION"
          test "$(jq -r .packageManager package.json)" = "pnpm@$PNPM_VERSION"
          node --input-type=module -e '
          import { readFileSync, realpathSync } from "node:fs";
          import { relative } from "node:path";
          const checkers = { eslint: ["eslint"], typescript: ["tsc"], prettier: ["prettier"], vitest: ["vitest"], "typescript-eslint": [], "@eslint/js": [] };
          const bad = [];
          for (const [name, bins] of Object.entries(checkers)) {
            const store = `.pnpm/${name.replace("/", "+")}@`;
            const real = relative("node_modules", realpathSync(`node_modules/${name}`));
            const match = real.startsWith(store) ? /^([0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?)(?:_[^/]+)?\/node_modules\/(.+)$/.exec(real.slice(store.length)) : null;
            const pkg = JSON.parse(readFileSync(`node_modules/${name}/package.json`, "utf8"));
            if (!match || match[2] !== name || pkg.name !== name || pkg.version !== match[1]) {
              bad.push(`${name} resolves to ${real} (${pkg.name}@${pkg.version})`);
              continue;
            }
            for (const bin of bins) {
              const targets = [...readFileSync(`node_modules/.bin/${bin}`, "utf8").matchAll(/"\$basedir\/\.\.\/([^"]+)"/g)].map((t) => t[1]);
              if (targets.length === 0 || targets.some((t) => !t.startsWith(`${real}/`))) bad.push(`.bin/${bin} runs ${targets.join(", ") || "nothing recognisable"}`);
            }
          }
          for (const problem of bad) console.log(`::error::${problem}`);
          process.exit(bad.length === 0 ? 0 : 1);
          '
      # Owner style and ignore list: a PR's prettier config could run plugins or narrow the scope.
      - run: |
          printf 'pnpm-lock.yaml\nnode_modules/\n' > "$RUNNER_TEMP/prettierignore"
          pnpm exec prettier --check --no-config --no-editorconfig --ignore-path "$RUNNER_TEMP/prettierignore" .
      # Explicit root config: ESLint 10 otherwise lets a nested eslint.config.* replace it.
      - run: pnpm exec eslint --config eslint.config.js --max-warnings 0 .
      - run: pnpm exec tsc -p tsconfig.json
      # Explicit config: the only one the guard allows. No `pnpm test`, whose script a PR could replace.
      - run: pnpm exec vitest run --config vitest.config.ts
      - name: Generated code matches the schemas
        run: |
          node packages/schema/scripts/generate.ts
          # --ignored for generated/, so a PR's .gitignore can't hide a new generated file.
          changes=$(git status --porcelain --untracked-files=all; git status --porcelain --ignored -- packages/schema/generated)
          if [ -n "$changes" ]; then
            echo "::error::Regenerating from the schemas changed these files; commit the generator's output:"
            echo "$changes"
            git diff
            exit 1
          fi
