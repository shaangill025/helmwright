name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --check .
      # Explicit root config: ESLint 10 otherwise lets a nested eslint.config.* replace it.
      - run: pnpm exec eslint --config eslint.config.js --max-warnings 0 .
      - run: pnpm exec tsc -p tsconfig.json
      # Explicit config: the only one the guard allows. No `pnpm test`, whose script a PR could replace.
      - run: pnpm exec vitest run --config vitest.config.ts
      - name: Generated code matches the schemas
        run: |
          node packages/schema/scripts/generate.ts
          changes=$(git status --porcelain --untracked-files=all)
          if [ -n "$changes" ]; then
            echo "::error::Regenerating from the schemas changed these files; commit the generator's output:"
            echo "$changes"
            git diff
            exit 1
          fi
