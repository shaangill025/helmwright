name: sensors

# The scanning jobs run on pull_request_target, so the workflow, the tool pins and the owner configs
# come from main and a PR cannot weaken the scans that gate it. Each job checks out the PR head as
# data and reads it with pinned tools; no job runs code from the PR. The token is read-only, no job
# uses a secret or the Actions cache. The sandbox image build runs the PR's Dockerfile, so it lives
# in image.yml on pull_request. `pull_request` stays here only until main carries this file (CI1a);
# the follow-up PR (CI1b) removes it, and the guarantee above holds only after that.
on:
  pull_request:
  pull_request_target:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# No concurrency group: groups are shared by every workflow in the repository, so a PR could name
# another run's group and cancel it. A run with no group cannot be cancelled by other workflows.

# Ring 0 sensor floor. Every scanner is pinned by version and SHA-256 (binaries) or image digest,
# and candidate-supplied suppressions/config are ignored or rejected.
env:
  # Keep in sync with verify.yml.
  PNPM_VERSION: "10.21.0"
  NODE_VERSION: "26"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  OSV_SCANNER_VERSION: "2.6.0"
  OSV_SCANNER_SHA256: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  ZIZMOR_VERSION: "1.30.1"
  ZIZMOR_SHA256: e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a
  SEMGREP_IMAGE: semgrep/semgrep@sha256:93963d9295a366f59e4850127b1550400ee7b388f04fe144e4a1f6325d96e01b # 1.179.0
  SEMGREP_RULES_SHA: a84ff9cc2453ca91d581380de4b8b3f272f6f4be

jobs:
  config-guard:
    name: scanner config guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # PR events: the PR head as data (never executed); the ruleset requires the branch to be up
      # to date, so the head equals the merge result. Push: the pushed commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      # First, before any tool reads the tree: a symlink could point it at runner files.
      - name: Reject symlinks
        shell: bash
        run: |
          set -euo pipefail
          links=$(git ls-files -s -z | tr '\0' '\n' | awk '$1 == "120000"' | wc -l)
          if [ "$links" -ne 0 ]; then
            echo "::error::Symlinks are not allowed in the repository"
            exit 1
          fi
      - name: Reject candidate-controlled tool config, ignore files and install hooks
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          error() { echo "::error::$*"; fail=1; }
          # grep exits 1 for "no match" (fine) and 2 for an error (fatal under pipefail).
          zmatch() { grep -zE "$1" || [ $? -eq 1 ]; }
          zdrop() { grep -zvE "$1" || [ $? -eq 1 ]; }

          # Config, ignore and hook files that scanners, linters, test runners or pnpm discover on
          # their own. NUL-separated names, so quoting of unusual paths can't dodge the pattern.
          discovered='(^|/)(\.gitleaks\.toml|\.gitleaksignore|\.semgrepignore|osv-scanner\.toml|zizmor\.ya?ml|actionlint\.ya?ml|\.grype\.ya?ml|\.grype/[^/]+|\.npmrc|\.yarnrc(\.ya?ml)?|\.pnpmfile\.[cm]?js|package\.(yaml|json5)|\.eslintrc(\.[a-z]+)?|eslint\.config\.[cm]?[jt]s|[jt]sconfig[^/]*\.json|\.prettierrc(\.[a-z]+)?|prettier\.config\.[cm]?[jt]s|\.editorconfig|vite\.config\.[cm]?[jt]s|vitest\.(config|workspace)\.[cm]?[jt]s)$'
          owner_files='^(eslint\.config\.js|tsconfig\.json|tsconfig\.base\.json|vitest\.config\.ts)$'
          found=$(git ls-files -z | zmatch "$discovered" | zdrop "$owner_files" | tr '\0' ' ')
          if [ -n "$found" ]; then
            error "Tool config, ignore and hook files are owner-controlled; only the root eslint.config.js, tsconfig and vitest.config.ts are allowed: $found"
          fi

          # pnpm-workspace.yaml can load code (pnpmfile, nodeOptions) or allow build scripts in many
          # spellings, so it must match the owner's content exactly.
          expected=$(cat <<'YAML'
          packages:
            - packages/*

          # Fail install on the wrong Node major instead of warning.
          engineStrict: true
          # Refuse versions published less than 3 days ago (supply-chain floor).
          minimumReleaseAge: 4320
          YAML
          )
          if [ "$(cat pnpm-workspace.yaml)" != "$expected" ]; then
            error "pnpm-workspace.yaml differs from the owner-approved content"
          fi

          # Manifests: no install-time code, no pnpm settings block, registry or workspace
          # dependencies only (file:, link:, git and npm: aliases could swap out the checkers), and
          # the pinned pnpm (an older pnpm runs dependency build scripts by default).
          while IFS= read -r -d '' manifest; do
            problems=$(jq -r --arg pm "pnpm@$PNPM_VERSION" --arg root "$([ "$manifest" = package.json ] && echo yes || echo no)" '
              ((.scripts // {}) | keys[] | select(test("^(pre|post)?(install|prepare)$|^prepublish$|^pnpm:")) | "lifecycle script \(.)"),
              (if has("pnpm") then "pnpm settings block" else empty end),
              (if has("resolutions") or has("overrides") then "resolutions/overrides block" else empty end),
              (if has("devEngines") then "devEngines block (pnpm would switch to its version)" else empty end),
              ((.dependencies, .devDependencies, .optionalDependencies, .peerDependencies) // {} | to_entries[]
                | select(
                    (.value | test("^[~^]?[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.-]+)?$"))
                    or ((.key | startswith("@helmwright/")) and (.value | test("^workspace:[*^~]?$")))
                    | not)
                | "dependency \(.key)@\(.value) is neither registry semver nor an @helmwright workspace package"),
              (if $root == "yes" and .packageManager != $pm then "packageManager must be \($pm)" else empty end),
              (if $root == "no" and has("bin") then "workspace packages may not declare bin (could shadow a checker)" else empty end)
            ' "./$manifest")
            if [ -n "$problems" ]; then
              error "$manifest: $(printf '%s' "$problems" | tr '\n' ';')"
            fi
          done < <(git ls-files -z | zmatch '(^|/)package\.json$')

          # Lockfile: --frozen-lockfile only compares specifiers, so the resolutions themselves must be
          # registry tarballs (integrity only), and links may only point at sibling @helmwright packages.
          test -s pnpm-lock.yaml || error "pnpm-lock.yaml is missing or empty"
          bad_resolutions=$(grep -nE 'resolution:' pnpm-lock.yaml | grep -vE '^[0-9]+:\s+resolution: \{integrity: sha512-[A-Za-z0-9+/=]+\}$' || [ $? -eq 1 ])
          if [ -n "$bad_resolutions" ]; then
            error "pnpm-lock.yaml has non-registry resolutions: $(printf '%s' "$bad_resolutions" | head -3 | tr '\n' ';')"
          fi
          bad_links=$(awk '
            { match($0, /^ */); indent = RLENGTH }
            /:$/ && indent < 8 { parent = $0 }
            /link:/ && !(parent ~ /^      '"'"'?@helmwright\/[a-z0-9-]+'"'"'?:$/ && $0 ~ /^        version: link:\.\.\/[a-z0-9-]+$/) { print NR ": " $0 }
          ' pnpm-lock.yaml)
          if [ -n "$bad_links" ]; then
            error "pnpm-lock.yaml links outside @helmwright packages: $(printf '%s' "$bad_links" | head -3 | tr '\n' ';')"
          fi

          # The Node version comes from the workflow, not from the PR.
          if [ "$(cat .node-version)" != "$NODE_VERSION" ]; then
            error ".node-version must be $NODE_VERSION"
          fi
          exit "$fail"

  secrets:
    name: gitleaks (full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # PR events: the PR head as data (never executed); the ruleset requires the branch to be up
      # to date, so the head equals the merge result. Push: the pushed commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # First, before any tool reads the tree: a symlink could point it at runner files.
      - name: Reject symlinks
        shell: bash
        run: |
          set -euo pipefail
          links=$(git ls-files -s -z | tr '\0' '\n' | awk '$1 == "120000"' | wc -l)
          if [ "$links" -ne 0 ]; then
            echo "::error::Symlinks are not allowed in the repository"
            exit 1
          fi
      - name: Install gitleaks
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan
        run: '"$RUNNER_TEMP/gitleaks" git --ignore-gitleaks-allow --redact --no-banner --exit-code 1 .'

  dependencies:
    name: osv-scanner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # PR events: the PR head as data (never executed); the ruleset requires the branch to be up
      # to date, so the head equals the merge result. Push: the pushed commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      # First, before any tool reads the tree: a symlink could point it at runner files.
      - name: Reject symlinks
        shell: bash
        run: |
          set -euo pipefail
          links=$(git ls-files -s -z | tr '\0' '\n' | awk '$1 == "120000"' | wc -l)
          if [ "$links" -ne 0 ]; then
            echo "::error::Symlinks are not allowed in the repository"
            exit 1
          fi
      - name: Install osv-scanner
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"
      - name: Scan
        run: '"$RUNNER_TEMP/osv-scanner" scan source --lockfile pnpm-lock.yaml'

  static:
    name: semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # PR events: the PR head as data (never executed); the ruleset requires the branch to be up
      # to date, so the head equals the merge result. Push: the pushed commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      # First, before any tool reads the tree: a symlink could point it at runner files.
      - name: Reject symlinks
        shell: bash
        run: |
          set -euo pipefail
          links=$(git ls-files -s -z | tr '\0' '\n' | awk '$1 == "120000"' | wc -l)
          if [ "$links" -ne 0 ]; then
            echo "::error::Symlinks are not allowed in the repository"
            exit 1
          fi
      - name: Fetch pinned rules
        run: |
          git init -q "$RUNNER_TEMP/semgrep-rules"
          git -C "$RUNNER_TEMP/semgrep-rules" fetch -q --depth 1 https://github.com/semgrep/semgrep-rules.git "$SEMGREP_RULES_SHA"
          git -C "$RUNNER_TEMP/semgrep-rules" checkout -q FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/semgrep-rules" rev-parse HEAD)" = "$SEMGREP_RULES_SHA"
      # Scan a copy carrying an owner-written .semgrepignore: without one, Semgrep's built-in
      # defaults silently skip tests/, build/, vendor/ and friends; --no-git-ignore stops a PR's
      # .gitignore from hiding files. nosem comments stay disabled. Accepted: exactly the 5
      # pull-request-target-code-checkout findings for the 5 jobs below, in sensors.yml only (they
      # check out the PR head as data and never run it); a sixth checkout or any other finding
      # fails the job. Update ACCEPTED_CHECKOUTS when a job is added or removed.
      - name: Scan
        shell: bash
        run: |
          set -euo pipefail
          cp -a "$GITHUB_WORKSPACE" "$RUNNER_TEMP/scan"
          rm -f "$RUNNER_TEMP/scan/.semgrepignore"
          printf 'node_modules/\n' > "$RUNNER_TEMP/scan/.semgrepignore"
          mkdir -m 777 "$RUNNER_TEMP/semgrep-out"
          docker run --rm --network none \
            -v "$RUNNER_TEMP/scan:/src:ro" -v "$RUNNER_TEMP/semgrep-rules:/rules:ro" \
            -v "$RUNNER_TEMP/semgrep-out:/out" -w /src \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/src \
            "$SEMGREP_IMAGE" semgrep scan --metrics=off --disable-nosem --strict --no-git-ignore \
            --max-target-bytes=0 --json-output=/out/semgrep.json \
            --config /rules/javascript --config /rules/typescript --config /rules/yaml/github-actions /src
          ACCEPTED_CHECKOUTS=5
          out="$RUNNER_TEMP/semgrep-out/semgrep.json"
          # jq -e fails on empty output; the regex rejects anything that is not a count.
          count() { local v; v=$(jq -e "$1" "$out"); [[ $v =~ ^[0-9]+$ ]] || exit 1; echo "$v"; }
          accepted=$(count '[.results[] | select(.check_id == "rules.yaml.github-actions.security.pull-request-target-code-checkout" and .path == "/src/.github/workflows/sensors.yml")] | length')
          total=$(count '.results | length')
          errors=$(count '.errors | length')
          if [ "$accepted" -ne "$ACCEPTED_CHECKOUTS" ] || [ "$total" -ne "$accepted" ] || [ "$errors" -ne 0 ]; then
            echo "::error::Semgrep: $accepted accepted checkout finding(s) (expected $ACCEPTED_CHECKOUTS), $((total - accepted)) other finding(s), $errors error(s); see the output above"
            exit 1
          fi

  workflows:
    name: actionlint + zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # PR events: the PR head as data (never executed); the ruleset requires the branch to be up
      # to date, so the head equals the merge result. Push: the pushed commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      # First, before any tool reads the tree: a symlink could point it at runner files.
      - name: Reject symlinks
        shell: bash
        run: |
          set -euo pipefail
          links=$(git ls-files -s -z | tr '\0' '\n' | awk '$1 == "120000"' | wc -l)
          if [ "$links" -ne 0 ]; then
            echo "::error::Symlinks are not allowed in the repository"
            exit 1
          fi
      - name: Install actionlint and zizmor
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/zizmor.tar.gz" \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ZIZMOR_SHA256}  $RUNNER_TEMP/zizmor.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/zizmor.tar.gz" -C "$RUNNER_TEMP" zizmor
      # Owner-controlled empty config, so a repo .github/actionlint.yaml can't add ignore rules.
      # shellcheck/pyflakes integration disabled: their runner-image versions are not pinned.
      - name: actionlint
        run: |
          : > "$RUNNER_TEMP/actionlint.yaml"
          "$RUNNER_TEMP/actionlint" -config-file "$RUNNER_TEMP/actionlint.yaml" -shellcheck= -pyflakes=
      # Online audits (impostor commits, known-vulnerable actions) use the read-only job token.
      # Ignore comments and config stay disabled (--no-ignores also drops config ignores);
      # --collect=all stops a PR's .gitignore from hiding a workflow, and --strict-collection fails
      # on files zizmor cannot parse. The one accepted finding is a single dangerous-triggers on
      # sensors.yml for pull_request_target: that trigger is the owner's decision
      # (docs/decisions.md, CI sensor floor → Enforcement), and its jobs never run PR code. Any
      # other finding, another trigger, or a second finding there fails the job.
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          zizmor_args=(--no-ignores --no-config --collect=all --strict-collection)
          "$RUNNER_TEMP/zizmor" "${zizmor_args[@]}" . || true
          status=0
          "$RUNNER_TEMP/zizmor" "${zizmor_args[@]}" --format json . > "$RUNNER_TEMP/zizmor.json" || status=$?
          # 0 = no findings, 10-14 = findings by severity; anything else is a tool failure.
          if [ "$status" -ne 0 ] && { [ "$status" -lt 10 ] || [ "$status" -gt 14 ]; }; then
            echo "::error::zizmor failed with exit code $status"
            exit 1
          fi
          out="$RUNNER_TEMP/zizmor.json"
          # jq -e fails on empty output; the regex rejects anything that is not a count.
          count() { local v; v=$(jq -e "$1" "$out"); [[ $v =~ ^[0-9]+$ ]] || exit 1; echo "$v"; }
          accepted=$(count '[.[] | select(.ident == "dangerous-triggers" and ([.locations[] | select(.symbolic.kind == "Primary") | {path: .symbolic.key.Local.verbatim_path, note: .symbolic.annotation}] == [{path: "./.github/workflows/sensors.yml", note: "pull_request_target is almost always used insecurely"}]))] | length')
          total=$(count 'length')
          if [ "$accepted" -gt 1 ] || [ "$total" -ne "$accepted" ]; then
            echo "::error::zizmor reported $((total - accepted)) unaccepted finding(s); see the output above"
            exit 1
          fi
