name: sensors

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sensors-${{ github.ref }}
  # Never cancel runs on main: every merged commit keeps its sensor evidence.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Ring 0 sensor floor. Every scanner is pinned by version and SHA-256 (binaries) or image digest,
# and candidate-supplied suppressions/config are ignored or rejected.
env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  OSV_SCANNER_VERSION: "2.6.0"
  OSV_SCANNER_SHA256: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  ZIZMOR_VERSION: "1.30.1"
  ZIZMOR_SHA256: e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a
  SEMGREP_IMAGE: semgrep/semgrep@sha256:93963d9295a366f59e4850127b1550400ee7b388f04fe144e4a1f6325d96e01b # 1.179.0
  SEMGREP_RULES_SHA: a84ff9cc2453ca91d581380de4b8b3f272f6f4be

jobs:
  config-guard:
    name: scanner config guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject candidate-controlled tool config, ignore files and install hooks
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          # grep exits 1 for "no match" (fine) and 2 for an error (fatal under pipefail).
          match() { grep -E "$1" || [ $? -eq 1 ]; }
          drop() { grep -vE "$1" || [ $? -eq 1 ]; }

          # Config and ignore files that scanners, linters or pnpm discover on their own.
          discovered='(^|/)(\.gitleaks\.toml|\.gitleaksignore|\.semgrepignore|osv-scanner\.toml|zizmor\.ya?ml|actionlint\.ya?ml|\.npmrc|\.pnpmfile\.[cm]?js|\.eslintrc(\.[a-z]+)?|eslint\.config\.[cm]?[jt]s|tsconfig[^/]*\.json)$'
          owner_files='^(eslint\.config\.js|tsconfig\.json|tsconfig\.base\.json)$'
          found=$(git ls-files | match "$discovered" | drop "$owner_files")
          if [ -n "$found" ]; then
            echo "::error::Tool config and ignore files are owner-controlled; only the root eslint.config.js and tsconfig files are allowed:"
            echo "$found"
            fail=1
          fi

          # Lifecycle scripts run code during `pnpm install`, before any check.
          for manifest in $(git ls-files | match '(^|/)package\.json$'); do
            hooks=$(jq -r '(.scripts // {}) | keys[] | select(test("^(pre|post)?(install|prepare)$|^prepublish$"))' "$manifest")
            builds=$(jq -r '(.pnpm // {}) | keys[] | select(. == "onlyBuiltDependencies" or . == "dangerouslyAllowAllBuilds")' "$manifest")
            if [ -n "$hooks$builds" ]; then
              echo "::error::$manifest declares install-time code: $hooks $builds"
              fail=1
            fi
          done
          if match '^\s*(onlyBuiltDependencies|dangerouslyAllowAllBuilds)\s*:' < pnpm-workspace.yaml | grep -q .; then
            echo "::error::pnpm-workspace.yaml allows dependency build scripts"
            fail=1
          fi
          exit "$fail"

  secrets:
    name: gitleaks (full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan
        run: '"$RUNNER_TEMP/gitleaks" git --ignore-gitleaks-allow --redact --no-banner --exit-code 1 .'

  dependencies:
    name: osv-scanner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install osv-scanner
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"
      - name: Scan
        run: '"$RUNNER_TEMP/osv-scanner" scan source --lockfile pnpm-lock.yaml'

  static:
    name: semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch pinned rules
        run: |
          git init -q "$RUNNER_TEMP/semgrep-rules"
          git -C "$RUNNER_TEMP/semgrep-rules" fetch -q --depth 1 https://github.com/semgrep/semgrep-rules.git "$SEMGREP_RULES_SHA"
          git -C "$RUNNER_TEMP/semgrep-rules" checkout -q FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/semgrep-rules" rev-parse HEAD)" = "$SEMGREP_RULES_SHA"
      # Scan a copy carrying an owner-written .semgrepignore: without one, Semgrep's built-in
      # defaults silently skip tests/, build/, vendor/ and friends.
      - name: Scan
        run: |
          cp -a "$GITHUB_WORKSPACE" "$RUNNER_TEMP/scan"
          printf 'node_modules/\n' > "$RUNNER_TEMP/scan/.semgrepignore"
          docker run --rm --network none \
            -v "$RUNNER_TEMP/scan:/src:ro" -v "$RUNNER_TEMP/semgrep-rules:/rules:ro" -w /src \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/src \
            "$SEMGREP_IMAGE" semgrep scan --metrics=off --disable-nosem --error --strict \
            --max-target-bytes=0 \
            --config /rules/javascript --config /rules/typescript --config /rules/yaml/github-actions /src

  workflows:
    name: actionlint + zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint and zizmor
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/zizmor.tar.gz" \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ZIZMOR_SHA256}  $RUNNER_TEMP/zizmor.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/zizmor.tar.gz" -C "$RUNNER_TEMP" zizmor
      # Owner-controlled empty config, so a repo .github/actionlint.yaml can't add ignore rules.
      # shellcheck/pyflakes integration disabled: their runner-image versions are not pinned.
      - name: actionlint
        run: |
          : > "$RUNNER_TEMP/actionlint.yaml"
          "$RUNNER_TEMP/actionlint" -config-file "$RUNNER_TEMP/actionlint.yaml" -shellcheck= -pyflakes=
      # Online audits (impostor commits, known-vulnerable actions) use the read-only job token.
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/zizmor" --no-ignores --no-config .'
